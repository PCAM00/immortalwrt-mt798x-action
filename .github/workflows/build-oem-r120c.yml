name: Build oem_wifi6_sx_7981r120c

on:
  workflow_dispatch:
  push:
    branches:
      - ci/oem-r120c

permissions:
  contents: read

jobs:
  build:
    name: Build ImmortalWrt for oem_wifi6_sx_7981r120c
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install build dependencies + LLVM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang llvm lld flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            rsync swig unzip zstd zip file wget python3 python3-setuptools
          echo "clang: $(clang --version | head -1)"

      - name: Clone source (PCAM00/immortalwrt-mt798x-6.6)
        run: |
          git clone --depth 1 -b openwrt-24.10-6.6 \
            https://github.com/PCAM00/immortalwrt-mt798x-6.6 immortalwrt
          cd immortalwrt
          echo "source HEAD: $(git rev-parse HEAD)"

      - name: Apply board support
        run: |
          cd immortalwrt
          cp ../board-support/dts/mt7981b-wifi6-sx-7981r120c.dts target/linux/mediatek/dts/
          cp ../board-support/board.d/01_leds      target/linux/mediatek/filogic/base-files/etc/board.d/01_leds
          cp ../board-support/board.d/02_network   target/linux/mediatek/filogic/base-files/etc/board.d/02_network
          cp ../board-support/filogic.mk           target/linux/mediatek/image/filogic.mk
          cp ../board-support/preinit/90_extract_caldata \
             target/linux/mediatek/filogic/base-files/lib/preinit/90_extract_caldata
          echo "=== 校验 ==="
          echo "filogic.mk 机型条目 : $(grep -c oem_wifi6_sx_7981r120c target/linux/mediatek/image/filogic.mk)"
          echo "preinit 校准分支     : $(grep -c 'oem,wifi6-sx-7981r120c' target/linux/mediatek/filogic/base-files/lib/preinit/90_extract_caldata)"
          echo "DTS phy*tpt 残留    : $(grep -c 'phy[01]tpt' target/linux/mediatek/dts/mt7981b-wifi6-sx-7981r120c.dts)"
          echo "DTS &hnat           : $(grep -c 'ext-devices-prefix' target/linux/mediatek/dts/mt7981b-wifi6-sx-7981r120c.dts)"
          echo "01_leds 灯条目      : $(grep -c 'ucidef_set_led' target/linux/mediatek/filogic/base-files/etc/board.d/01_leds)"

      - name: Configure (device + packages)
        run: |
          cd immortalwrt
          cp ../board-support/seed.config .config
          make defconfig
          fail=0
          for s in 'CONFIG_TARGET.*DEVICE_oem_wifi6_sx_7981r120c=y' \
                   'CONFIG_MTK_CONNINFRA_APSOC_MT7981=y' 'CONFIG_PACKAGE_kmod-conninfra=y' \
                   'CONFIG_PACKAGE_kmod-mt_wifi=y'; do
            if grep -qE "^$s" .config; then echo "  OK   $s"; else echo "  MISS $s"; fail=1; fi
          done
          echo "已启用软件包: $(grep -c '^CONFIG_PACKAGE_.*=y' .config) 个"
          exit $fail

      - name: Download source tarballs
        run: cd immortalwrt && make -j$(nproc) download

      - name: Build firmware
        run: |
          cd immortalwrt
          if ! make -j$(nproc); then
            echo "################ 构建失败：V=s 重跑安装阶段定位 ################"
            make -j1 V=s package/install 2>&1 | tail -180 || true
            echo "################ logs 目录 ################"
            ls -la logs 2>/dev/null | head -20
            find logs -type f 2>/dev/null | head -20
            echo "################ 磁盘 ################"
            df -h /
            exit 1
          fi

      - name: Dump build logs (on failure)
        if: failure()
        run: |
          set +e
          echo "=== logs 目录 ==="; ls -la immortalwrt/logs 2>/dev/null | head -20
          for f in $(find immortalwrt/logs -type f -size +0c 2>/dev/null | head -10); do
            echo "########## $f"; tail -50 "$f"
          done
          echo "=== 磁盘 ==="; df -h /
          echo "=== build_dir 占用前 10 ==="; du -sh immortalwrt/build_dir/target-*/ 2>/dev/null; du -sh immortalwrt/build_dir/* 2>/dev/null | sort -hr | head -10

      - name: Show output
        run: ls -lh immortalwrt/bin/targets/mediatek/filogic/ | head -40

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: oem_wifi6_sx_7981r120c-firmware
          path: |
            immortalwrt/bin/targets/mediatek/filogic/*sysupgrade.bin
            immortalwrt/bin/targets/mediatek/filogic/sha256sums
            immortalwrt/bin/targets/mediatek/filogic/*.manifest
          if-no-files-found: error
          retention-days: 30
